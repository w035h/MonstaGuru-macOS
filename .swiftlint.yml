disabled_rules:
  - colon
  - comma
  - control_statement
  - todo
  - trailing_whitespace
  - line_length
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - no_extension_access_modifier
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - redundant_nil_coalescing
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call

included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - Package.swift

analyzer_rules:
  - unused_declaration
  - unused_import

warning_threshold: 5
error_threshold: 10

reporter: "xcode"

custom_rules:
  no_hardcoded_strings:
    name: "No Hardcoded Strings"
    regex: "\"([^\\"]{10,})\""
    message: "Avoid hardcoded strings longer than 10 characters. Use localized strings or constants."
    severity: warning
